<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ethiopia Bingo Fun</title>
  <script src="https://telegram.org"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 16px;
    }
    h1 { color: #facc15; margin-bottom: 4px; }
    #player-name { color: #a3e635; font-size: 15px; margin-bottom: 12px; }
    #called-box {
      background: #1f2937;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      max-width: 340px;
      margin: 0 auto 18px;
    }
    .header {
      background: #facc15;
      color: #000;
      font-weight: bold;
      padding: 10px 0;
      border-radius: 6px;
    }
    .cell {
      background: #27272a;
      padding: 14px 0;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .cell.marked {
      background: #22c55e;
      color: #000;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px;
    }
  </style>
</head>
<body>
  <h1>🎉 ኢትዮጵያ ቢንጎ 🎉</h1>
  <div id="player-name">እንኳን ደህና መጡ!</div>
  <div id="called-box">የወጣ ቁጥር: <span id="current-num">-</span></div>

  <div class="board" id="board"></div>

  <button onclick="callNumber()">ቁጥር አውጣ</button>
  <button onclick="newCard()" style="background:#ef4444;">አዲስ ካርድ</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById("player-name").innerText =
        "ተጫዋች: " + tg.initDataUnsafe.user.first_name;
    }

    const letters = ["B", "I", "N", "G", "O"];
    let calledNumbers = [];

    function generateColumn(min, max) {
      let nums = [];
      while (nums.length < 5) {
        let r = Math.floor(Math.random() * (max - min + 1)) + min;
        if (!nums.includes(r)) nums.push(r);
      }
      return nums;
    }

    function newCard() {
      calledNumbers = [];
      document.getElementById("current-num").innerText = "-";
      const board = document.getElementById("board");
      board.innerHTML = "";

      letters.forEach(l => {
        const div = document.createElement("div");
        div.className = "header";
        div.innerText = l;
        board.appendChild(div);
      });

      const cols = [
        generateColumn(1, 15),
        generateColumn(16, 30),
        generateColumn(31, 45),
        generateColumn(46, 60),
        generateColumn(61, 75)
      ];

      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          if (row === 2 && col === 2) {
            cell.innerText = "FREE";
            cell.classList.add("marked");
          } else {
            cell.innerText = cols[col][row];
            cell.onclick = () => cell.classList.toggle("marked");
          }
          board.appendChild(cell);
        }
      }
    }

    function callNumber() {
      if (calledNumbers.length >= 75) return alert("ሁሉም ቁጥሮች ወጥተዋል!");
      let num;
      do {
        num = Math.floor(Math.random() * 75) + 1;
      } while (calledNumbers.includes(num));
      calledNumbers.push(num);

      let prefix = num <= 15 ? "B" : num <= 30 ? "I" : num <= 45 ? "N" : num <= 60 ? "G" : "O";
      document.getElementById("current-num").innerText = prefix + "-" + num;
    }

    newCard();
  </script>
</body>
</html>
